[tool.poetry]
name = "task-tracker"
version = "0.1.0"
description = "Task management API"
authors = ["Task Tracker <task-tracker@localhost>"]
readme = "README.md"
packages = [{ include = "tasktracker", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.14"
pydantic-settings = "^2.6"
pyjwt = "^2.10"
pwdlib = { extras = ["argon2"], version = "^0.2" }
email-validator = "^2.2"
python-multipart = "^0.0.18"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
httpx = "^0.28"
ruff = "^0.8"
mypy = "^1.14"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
cache_dir = "/tmp/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tasktracker", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["tasktracker"]
cache_dir = "/tmp/mypy-cache"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
