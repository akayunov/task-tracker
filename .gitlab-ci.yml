# Отдельные stage: lint → unit → e2e → coverage (склейка + порог 80%).
# Runner: Docker executor + privileged DinD.

stages:
  - lint
  - unit
  - e2e
  - coverage

variables:
  DOCKER_TLS_CERTDIR: '/certs'
  DOCKER_BUILDKIT: '1'
  COMPOSE_DOCKER_CLI_BUILD: '1'
  COVERAGE_FAIL_UNDER: '80'

.docker_job:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - docker info
    - chmod +x docker/*.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

lint:
  extends: .docker_job
  stage: lint
  variables:
    COMPOSE_PROJECT_NAME: 'tt_${CI_PIPELINE_ID}_lint'
  script:
    - ./docker/ci_lint.sh

unit:
  extends: .docker_job
  stage: unit
  variables:
    COMPOSE_PROJECT_NAME: 'tt_${CI_PIPELINE_ID}_unit'
  script:
    - ./docker/ci_unit.sh coverage-data/unit
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - coverage-data/unit/

e2e:
  extends: .docker_job
  stage: e2e
  variables:
    COMPOSE_PROJECT_NAME: 'tt_${CI_PIPELINE_ID}_e2e'
  script:
    - ./docker/ci_e2e.sh coverage-data/e2e
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - coverage-data/e2e/

coverage:
  extends: .docker_job
  stage: coverage
  variables:
    COMPOSE_PROJECT_NAME: 'tt_${CI_PIPELINE_ID}_cov'
  needs:
    - job: unit
      artifacts: true
    - job: e2e
      artifacts: true
  script:
    - ./docker/ci_coverage_report.sh coverage-data .
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - htmlcov/
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
